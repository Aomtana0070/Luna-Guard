name: Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pywebview yara-python pyinstaller
      - name: Run tests
        run: python -m unittest -v test_luna
      - name: Build desktop executable
        run: pyinstaller --clean --onefile --noconsole --uac-admin --icon "logo/Luna_Guard.ico" --name LunaGuard --collect-all webview --add-data "dashboard.html;." --add-data "locales.json;." --add-data "logo/Luna_Guard.png;logo" --add-data "luna_rules.yar;." luna_app.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaGuard-Windows
          path: dist/LunaGuard.exe
          if-no-files-found: error
