name: Mobile app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  android:
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production-release' || 'ci' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          cache: true
      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --org com.lunaguard --project-name luna_guard_mobile mobile/platform_scaffold
          cp -R mobile/platform_scaffold/android mobile/android
          sed -i 's/android:label="luna_guard_mobile"/android:label="Luna Guard"/' mobile/android/app/src/main/AndroidManifest.xml
          rm -rf mobile/platform_scaffold
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze
      - name: Run mobile scanner tests
        working-directory: mobile
        run: flutter test
      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Require Android release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
      - name: Sign and verify release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/lunaguard-release.jks"
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          SIGNED_APK="$RUNNER_TEMP/LunaGuard-Android-signed.apk"
          trap 'rm -f "$KEYSTORE_PATH" "$SIGNED_APK"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          mv "$SIGNED_APK" "$APK"
      - name: Verify Android APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Record Android artifact checksum and build provenance
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          sha256sum "$APK" > mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
          PRODUCTION_SIGNED=false
          SIGNING_IDENTITY=debug
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PRODUCTION_SIGNED=true; SIGNING_IDENTITY=release; fi
          printf '{"commit":"%s","ref":"%s","flutter":"3.44.9","signed":true,"production_signed":%s,"signing_identity":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$PRODUCTION_SIGNED" "$SIGNING_IDENTITY" > mobile/build/app/outputs/flutter-apk/build-provenance.json
      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk LunaGuard-Android.apk
          sha256sum LunaGuard-Android.apk > LunaGuard-Android.apk.sha256
          cp mobile/build/app/outputs/flutter-apk/build-provenance.json LunaGuard-Android.build-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LunaGuard-Android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
            mobile/build/app/outputs/flutter-apk/build-provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: LunaGuard-Android-Release
          path: |
            LunaGuard-Android.apk
            LunaGuard-Android.apk.sha256
            LunaGuard-Android.build-provenance.json
          if-no-files-found: error

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: production-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run desktop tests
        run: python -m unittest -v test_luna test_security
      - name: Build Windows executable
        run: pyinstaller --clean --onefile --noconsole --uac-admin --icon "logo/Luna_Guard.ico" --name LunaGuard --distpath dist/release --collect-all webview --add-data "dashboard.html;." --add-data "locales.json;." --add-data "logo/Luna_Guard.png;logo" --add-data "luna_rules.yar;." --add-data "rules;rules" --add-data "malware_knowledge.json;." luna_app.py
      - name: Require Windows release signing credentials
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Missing Windows signing secrets. Add WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD before tagging a release."
          }
        shell: pwsh
      - name: Sign and verify Windows executable
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign_windows.ps1 -Artifact dist/release/LunaGuard.exe
        shell: pwsh
      - name: Record executable checksum and build provenance
        run: python scripts/record_build.py dist/release/LunaGuard.exe --signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LunaGuard-Windows
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LunaGuard-Android-Release
          path: release-assets/android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LunaGuard-Windows
          path: release-assets/windows
      - name: Publish mobile and desktop assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release-assets/android/LunaGuard-Android.apk
            release-assets/android/LunaGuard-Android.apk.sha256
            release-assets/android/LunaGuard-Android.build-provenance.json
            release-assets/windows/LunaGuard.exe
            release-assets/windows/SHA256SUMS.txt
            release-assets/windows/build-provenance.json
          generate_release_notes: true

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          cache: true
      - name: Generate iOS platform project
        run: |
          flutter create --platforms=ios --org com.lunaguard --project-name luna_guard_mobile mobile/platform_scaffold
          cp -R mobile/platform_scaffold/ios mobile/ios
          perl -0pi -e "s/# platform :ios, '[^']*'/platform :ios, '14.0'/" mobile/ios/Podfile
          perl -0pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" mobile/ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Luna Guard" mobile/ios/Runner/Info.plist
          rm -rf mobile/platform_scaffold
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze
      - name: Run mobile scanner tests
        working-directory: mobile
        run: flutter test
      - name: Compile unsigned iOS app
        working-directory: mobile
        run: flutter build ios --release --no-codesign
